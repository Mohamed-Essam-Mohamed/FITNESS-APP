name: fitness_app
description: 'A new Flutter project.'
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.2
dependencies:
  flutter:
    sdk: flutter

  #? splash-screen

  #? UI-related packages: For building and styling the user interface
  youtube_player_flutter: ^9.1.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image:
  skeletonizer: ^1.4.3
  shimmer: ^3.0.0
  lottie: ^3.3.1
  toastification: ^3.0.2
  webview_flutter: ^4.11.0
  flutter_verification_code: ^1.1.7
  #? Network-related packages: For handling API calls and network operations
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  pretty_dio_logger: ^1.4.0
  retrofit_generator: ^9.1.9
  #? State Management packages
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  rxdart: ^0.28.0

  #? Storage-related packages: For persisting data locally
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  #? Utilities: General-purpose utilities and dependency injection
  easy_localization: ^3.0.7+1
  get_it: ^8.0.3
  injectable: ^2.5.0
  injectable_generator: ^2.7.0
  fluttertoast: ^8.2.12
  logger: ^2.5.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  country_picker: ^2.0.27
  http_parser: ^4.0.2

  #? Permissions: For handling runtime permissions
  permission_handler: ^12.0.0+1
  device_info_plus:

  #? Firebase: For Firebase services
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5
  retry: ^3.1.2
  timelines: ^0.1.0
  animate_do: ^4.2.0

  flutter_native_splash: ^2.4.4
  device_preview: ^1.2.0
  crystal_navigation_bar: ^1.0.4
  dot_navigation_bar: ^1.0.2
  flutter_launcher_icons: ^0.14.4

  numberpicker: ^2.1.1
  scrollable_positioned_list: ^0.3.8
  dio_cache_interceptor: ^4.0.3
  path_provider: ^2.1.5

  smooth_page_indicator: ^1.2.1
  percent_indicator: ^4.2.5
  flutter_gemini: 3.0.0
  cloud_firestore: ^5.6.11
  bloc: ^9.0.0
  youtube_player_iframe: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  #!flutter pub run easy_localization:generate --source-dir ./assets/translations -f keys -o locale_keys.g.dart
  json_serializable: ^6.9.4 # Code generator for JSON serialization

  #? helpers
  #! flutter packages pub run build_runner build
  #! flutter pub run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.15
  build: ^2.4.2
  mockito: ^5.4.5
  mocktail: ^1.0.4
  lint: ^2.7.0
flutter_icons:
  android: true
  ios: true
  image_path: 'assets/png/icon-launcher.png'
  adaptive_icon_background: '#242424'
  adaptive_icon_foreground: 'assets/png/play-store-icon-launcher.png'

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/png/
    - assets/svg/
    - assets/translations/
    - assets/json/
    - assets/lottie/

  fonts:
    - family: Baloo Thambi 2
      fonts:
        - asset: assets/fonts/baloo/BalooThambi2-Regular.ttf
